services:
  paysyslabs-demo:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4173:4173"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "4173"
      HOST: "0.0.0.0"
      DATA_DIR: /app/data
    volumes:
      - paysyslabs_demo_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health', {headers: process.env.PUBLIC_DEMO_MODE==='1' ? {Authorization: 'Basic '+Buffer.from(process.env.DEMO_USERNAME+':'+process.env.DEMO_PASSWORD).toString('base64')} : {}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  paysyslabs_demo_data:
