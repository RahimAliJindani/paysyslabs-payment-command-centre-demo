name: Validate demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check server/index.js
          node --check server/admin.js
      - name: Backend tests
        run: npm test
      - name: Build container
        run: docker build -t paysyslabs-baap:test .
